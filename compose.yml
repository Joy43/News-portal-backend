services:
  server:
    container_name: newsportal-server
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - 5050:5050
    depends_on:
      db:
        condition: service_healthy  
    command: >
      sh -c "
        npx prisma migrate deploy &&
        npm run start:prod
      "

  db:
    image: postgres:17
    container_name: newsportal_db  
    restart: always
    user: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: newsportal  
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d newsportal"] 
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db-data: