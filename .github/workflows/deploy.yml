name: CI/CD Pipeline

on:
  push:
    branches: [dev, main]

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/newsportal-server:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/newsportal-server:latest

  deploy:
    name: Deploy to VPS/EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 🚀 CREATE .env FILE SECURELY FROM GITHUB SECRETS
      - name: Generate .env
        run: |
          echo "PORT=5050" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> .env
          echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" >> .env
          echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> .env
          echo "FIREBASE_PRIVATE_KEY=${{ secrets.FIREBASE_PRIVATE_KEY }}" >> .env
          echo "FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}" >> .env
          echo "APP_DOMAIN=${{ secrets.APP_DOMAIN }}" >> .env

      # 🚀 SAFE COPY OF FILES TO EC2
      - name: Upload docker-compose & .env
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: |
            docker-compose.yml
            .env
          target: ~/newsportal/
          port: 22
          debug: true

      # 🚀 DEPLOY USING SSH
      - name: Deploy to VPS/EC2
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USERNAME
          script: |
            cd ~/newsportal

            sudo systemctl restart docker

            export DOCKER_USERNAME=${DOCKER_USERNAME}

            sudo docker compose down --remove-orphans
            sudo docker compose rm -f
            sudo docker compose pull
            sudo docker compose up -d
            sudo docker image prune -f

            sleep 5
            sudo docker compose ps
            sudo docker compose logs --tail 20 server
