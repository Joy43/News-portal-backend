name: CI/CD Pipeline

on:
  push:
    branches: [dev, main]

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/newsportal-server:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/newsportal-server:latest

  deploy:
    name: Deploy to VPS/EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/newsportal"

      - name: Copy .env file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ".env.production" # Use a separate production .env file
          target: "~/newsportal/.env"

      - name: Deploy to VPS/EC2 via SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/newsportal

            # Set environment variable for Docker Compose
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

            # Deploy: Stop old, pull new image, start
            sudo docker compose down --remove-orphans
            sudo docker compose rm -f
            sudo docker compose pull
            sudo docker compose up -d
            sudo docker image prune -f

            # Wait a moment for containers to start
            sleep 5

            # Check container status
            sudo docker compose ps

            # Tail logs briefly for verification
            sudo docker compose logs --tail=20 server
