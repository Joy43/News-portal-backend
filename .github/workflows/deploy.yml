name: CI/CD Pipeline

on:
  push:
    branches: [dev, main]

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  

      - name: Log in to Docker Hub
        uses: docker/login-action@v3  
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}

  deploy:
    name: Deploy to VPS/EC2
    runs-on: ubuntu-latest
    needs: build-and-push 

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to VPS/EC2 via SSH
        uses: appleboy/ssh-action@v1.2.4 
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
      
          script: |
            # Ensure app directory exists
            mkdir -p ~/newsportal
            cd ~/newsportal
            
            # Move uploaded file if needed (appleboy places in ~/.tmp/)
            if [ -f ~/.tmp/compose.yml ]; then
              mv ~/.tmp/compose.yml .
            fi
            
            # Deploy: Stop old, pull new image, start
            sudo docker compose down --remove-orphans
            sudo docker compose rm -f
            sudo docker compose pull
            sudo docker compose up -d
            sudo docker image prune -f
            
            # Optional: Tail logs briefly for verification
            sudo docker compose logs --tail=10 server || true